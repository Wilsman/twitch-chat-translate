name: Release

# Releases whenever src/manifest.json lands on main with a version that has no tag yet,
# or on demand from the Actions tab, which bumps the version first.
on:
  push:
    branches: [main]
    paths: [src/manifest.json]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check
        run: |
          for f in src/*.js; do node --check "$f"; done
          node -e 'JSON.parse(require("fs").readFileSync("src/manifest.json"))'

      - name: Bump version
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          node -e '
            const fs = require("fs");
            const f = "src/manifest.json";
            const s = fs.readFileSync(f, "utf8");
            const v = s.match(/"version": "(\d+)\.(\d+)\.(\d+)"/).slice(1).map(Number);
            const i = ["major", "minor", "patch"].indexOf(process.env.BUMP);
            v[i]++;
            v.fill(0, i + 1);
            fs.writeFileSync(f, s.replace(/"version": "[^"]+"/, `"version": "${v.join(".")}"`));
          '
          version=$(node -p 'require("./src/manifest.json").version')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$version"
          git push

      - name: Read version
        id: version
        run: |
          version=$(node -p 'require("./src/manifest.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released"
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and release
        if: steps.version.outputs.released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          zip="chat-translate-for-twitch-v$VERSION.zip"
          (cd src && zip -qrX "../$zip" .)
          gh release create "v$VERSION" "$zip" --title "v$VERSION" --target "$(git rev-parse HEAD)" --generate-notes
